<h1>Lista de Despesas</h1>
<a href="{% url 'despesa-add' %}">Adicionar Despesa</a>
<ul>
    {% for despesa in despesas %}
        <li>
            {{ despesa.categoria }} - {{ despesa.valor }}
            <a href="{% url 'despesa-edit' despesa.id %}">Editar</a>
            <a href="{% url 'despesa-delete' despesa.id %}">Deletar</a>
        </li>
    {% endfor %}
</ul>
