{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'investimentos.css' %}">

<h1>Lista de Investimentos</h1>
<a href="{% url 'criar_investimento' %}">Criar novo investimento</a>
<ul>
    {% for investimento in investimentos %}
        <li>
            <a href="{% url 'detalhes_investimento' investimento.pk %}">
                {{ investimento }}
            </a>
            <a href="{% url 'editar_investimento' investimento.pk %}">Editar</a>
            <a href="{% url 'deletar_investimento' investimento.pk %}">Deletar</a>
        </li>
    {% endfor %}
</ul>
