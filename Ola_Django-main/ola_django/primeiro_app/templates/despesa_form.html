<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if object %}Editar{% else %}Adicionar{% endif %} Despesa</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <aside class="menu">
            <h2>Menu</h2>
            <ul>
                <li><a href="{% url 'despesa-list' %}">Lista de Despesas</a></li>
            </ul>
        </aside>
        <main class="content">
            <h1>{% if object %}Editar{% else %}Adicionar{% endif %} Despesa</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">Salvar</button>
            </form>
        </main>
    </div>
</body>
</html>
