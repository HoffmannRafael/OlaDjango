<h1>Lista de Perfis de Economia</h1>
<a href="{% url 'perfil-economia-add' %}">Adicionar Perfil</a>
<ul>
    {% for perfil in perfis %}
        <li>
            {{ perfil.tipo }} - Ajuste Automático: {{ perfil.ajuste_automatico }}
            <a href="{% url 'perfil-economia-edit' perfil.id %}">Editar</a>
            <a href="{% url 'perfil-economia-delete' perfil.id %}">Deletar</a>
        </li>
    {% endfor %}
</ul>
